[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb.log

[program:kafka]
command=/opt/kafka/bin/kafka-server-start.sh /etc/kafka/server.properties
environment=JAVA_HOME="/usr/lib/jvm/default-java",KAFKA_HEAP_OPTS="-Xmx512M -Xms256M",KAFKA_OPTS="-Djava.net.preferIPv4Stack=true"
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/kafka.log
stderr_logfile=/var/log/supervisor/kafka.log

[program:idm]
command=/app/start-idm.sh
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/idm.log
stderr_logfile=/var/log/supervisor/idm.log
